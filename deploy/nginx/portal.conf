# ============================================================
# 学生门户 nginx —— 容器内监听 80，宿主映射 ${PORTAL_PORT:-80}
# 公网/内网统一入口：托管学生端静态资源 + 反代 /api/portal
# 安全基线：公开端口只代理学生端 API，管理/系统接口一律 403
# （对齐现有 scripts/nginx-campus.conf 的白名单策略）
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # 上传接口最大 10MB（后端 file.max-file-size），留余量防 413
    client_max_body_size 11m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # ---- 公开的学生端 API（反代到后端）----
    location /api/portal/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        # 同源部署下浏览器在 POST 等请求仍会携带 Origin；nginx 反代到后端不经过浏览器，
        # 显式清空 Origin 避免触发后端 CORS 白名单校验
        # （等价于 Vite dev 代理的 removeHeader('Origin')，见 CLAUDE.md「curl测试」节）。
        proxy_set_header Origin            "";
        # 简历文档转换/预览可能耗时较长，放宽超时
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # 归一化精确路径（极少数无尾部斜杠的 /api/portal 请求）
    location = /api/portal { return 302 /api/portal/; }

    # ---- 管理员/系统管理/公共接口：公开端口一律拒绝 ----
    location /api/admin/  { return 403; }
    location /api/system/ { return 403; }
    location /api/common/ { return 403; }
    location /api/        { return 403; }
    location /actuator    { return 404; }

    # ---- 静态资源长缓存 ----
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 隐藏文件（.git/.env 等）----
    location ~ /\. {
        return 404;
    }
}
