# ============================================================
# HR 管理后台 nginx —— 容器内监听 80，宿主映射 ${ADMIN_PORT:-8081}
# 仅限内网/受控网络访问；切勿将 ${ADMIN_PORT} 直接暴露公网。
# 反代 HR 后台 + 系统管理 + 公共接口全部 /api/* 到后端。
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # 上传接口最大 10MB（后端 file.max-file-size），留余量防 413
    client_max_body_size 11m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # ---- 反代全部 API 到后端 ----
    # 覆盖 /api/admin/**、/api/system/**、/api/common/** 及学生端接口
    # ^~ 使前缀匹配优先于静态资源正则 location，避免 /api/ 下以图片后缀结尾的动态请求
    # （头像 .jpg、简历缩略图 .png 等）被当作静态文件 404。
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        # 同源部署下浏览器在 POST 等请求仍会携带 Origin；nginx 反代到后端不经过浏览器，
        # 显式清空 Origin 避免触发后端 CORS 白名单校验
        proxy_set_header Origin            "";
        # 简历文档转换/预览可能耗时较长，放宽超时
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ---- 静态资源长缓存 ----
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 隐藏文件（.git/.env 等）----
    location ~ /\. {
        return 404;
    }
}
