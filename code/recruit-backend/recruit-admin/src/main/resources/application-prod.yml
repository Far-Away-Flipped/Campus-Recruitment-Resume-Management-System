server:
  # 生产环境仅监听回环地址，8080端口不直接对外/对内网暴露；
  # 内网/公网访问统一经由 Nginx 反代（同源，浏览器不触发CORS预检）。
  # 显式声明而非依赖 application.yml 主配置默认值，避免未来主配置变更时生产环境失守。
  # 详见《HR 后台「网络管理」模块设计方案 V1.0》第 2.2/2.3 节
  address: 127.0.0.1

# ────────── JWT 密钥（生产强制覆盖，未注入即拒绝启动） ──────────
# 无默认值：未注入 JWT_ADMIN_SECRET / JWT_PORTAL_SECRET 时，Spring 占位符解析失败、
# 启动即报错（fail-closed），绝不回落 application.yml 的开发弱密钥。
# Docker 部署由 docker-compose 注入；裸机 java -jar 直连部署需在系统环境变量配置。
jwt:
  admin:
    secret: ${JWT_ADMIN_SECRET}
  portal:
    secret: ${JWT_PORTAL_SECRET}

# ────────── 文件存储（生产强制覆盖，未注入即拒绝启动） ──────────
# 无默认值：裸机 prod 未注入 FILE_UPLOAD_ROOT 时启动即报错（fail-closed），
# 绝不回落 application.yml 的 Windows 本地路径（服务器上不存在，会导致上传失败）。
# Docker 部署由 docker-compose 注入 /data。
file:
  upload-root: ${FILE_UPLOAD_ROOT}

# ────────── LibreOffice 文档转换（可选，给 Linux 默认） ──────────
# 可选项：BrandConfig 可覆盖；给标准 Linux 路径而非强制（缺 env 不卡启动）。
libreoffice:
  path: ${LIBREOFFICE_PATH:/usr/bin/soffice}

# ────────── 短信（SMS_PROVIDER=aliyun 且 AK 齐备才走真实短信） ──────────
# 未注入 SMS_PROVIDER 时显式回落 mock（签名报备过渡期可继续 mock 运行）；
# provider=aliyun 但 AK/签名/模板码缺失时由 AliyunSmsSender 启动校验
# 拒绝启动（fail-closed），绝不带空凭证静默运行。
sms:
  provider: ${SMS_PROVIDER:mock}
  aliyun:
    access-key-id: ${SMS_ACCESS_KEY_ID:}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
    sign-name: 遨天科技
    template-code: ${SMS_TEMPLATE_CODE:}
    endpoint: dysmsapi.aliyuncs.com

# ────────── 邮件（MAIL_PROVIDER=smtp 且 SMTP 配置齐备才真发验证码邮件） ──────────
# 未注入 MAIL_PROVIDER 时显式回落 mock（验证码打日志）；
# provider=smtp 但 host/username/password 缺失时由 SmtpEmailSender 启动校验
# 拒绝启动（fail-closed）。当前注册/重置密码主验证通道即邮箱验证码。
mail:
  provider: ${MAIL_PROVIDER:mock}

spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
