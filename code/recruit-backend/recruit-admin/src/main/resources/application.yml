server:
  port: 8080
  address: 127.0.0.1
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: atmoto-recruit

  profiles:
    active: dev

  # Jackson 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # Servlet 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

# ────────── JWT 密钥（生产环境必须在 application-prod.yml 中覆盖） ──────────
jwt:
  admin:
    secret: YXRtb3RvLXJlY3J1aXQtYWRtaW4tc2VjcmV0LWtleS0yMDI2
    expiration: 30
  portal:
    secret: YXRtb3RvLXJlY3J1aXQtcG9ydGFsLXNlY3JldC1rZXktMjAyNg==
    access-expiration: 120
    refresh-expiration: 10080

# ────────── 文件存储 ──────────
file:
  upload-root: E:/atmoto-recruit/data
  max-file-size: 10485760
  allowed-extensions: pdf,doc,docx

# ────────── LibreOffice 文档转换 ──────────
libreoffice:
  path: D:/Program Files/LibreOffice/program/soffice.exe

# ────────── Actuator（安全：仅暴露 health，避免信息泄露） ──────────
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
