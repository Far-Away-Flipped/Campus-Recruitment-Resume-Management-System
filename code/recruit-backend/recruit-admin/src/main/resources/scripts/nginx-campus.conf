# ============================================================
#  Nginx public-facing vhost for atmoto-recruit (campus)
#  Purpose: Serve the student portal safely over HTTPS,
#  with strict access control for admin/internal paths.
# ============================================================

server {
    listen 443 ssl http2;
    server_name campus.atmoto.com;

    # ---- SSL ----
    ssl_certificate     /etc/nginx/ssl/campus.atmoto.com.pem;
    ssl_certificate_key /etc/nginx/ssl/campus.atmoto.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---- HSTS (start conservative: 86400 for first month, then 63072000) ----
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    # ---- Security headers ----
    server_tokens off;
    autoindex      off;

    # ---- Root: only static frontend dist ----
    root E:/atmoto-recruit/web/dist;
    index index.html;

    # ============================================================
    #  PATH WHITELIST
    # ============================================================

    # ---- Student portal API (public) ----
    location /api/portal/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Block ALL other API prefixes explicitly ----
    location /api/admin/  { return 403; }
    location /api/system/ { return 403; }
    location /api/common/ { return 403; }
    location /api/        { return 403; }

    # ---- Block RuoYi native paths ----
    location = /login        { return 403; }
    location = /getInfo      { return 403; }
    location = /getRouters   { return 403; }
    location = /captchaImage { return 403; }

    # ---- Block actuator outside localhost ----
    location /actuator { return 404; }

    # ---- Static assets whitelist ----
    location ~* \.(js|css|png|jpg|svg|woff2|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA fallback (only for non-api, non-static paths) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Deny hidden files (.git, .env, etc.) ----
    location ~ /\. {
        return 404;
    }

    # ---- Upload directory data/ NOT under any root ----
    # (data/ is served only by the backend app internally, never by nginx)
    location /data/ {
        return 404;
    }
}

# ---- HTTP -> HTTPS redirect ----
server {
    listen 80;
    server_name campus.atmoto.com;
    return 301 https://$host$request_uri;
}
